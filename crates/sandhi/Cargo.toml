[package]
name = "sandhi"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
clap = { version = "4.6.7", features = ["derive"] }
sandhi-tailnet = { path = "../tailnet" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "io-std", "signal"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
