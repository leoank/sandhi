[package]
name = "sandhi-tailnet"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "net", "sync", "time", "macros"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
